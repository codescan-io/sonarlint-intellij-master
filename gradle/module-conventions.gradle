// Apply common logic to all module build files

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }
}

kotlin {
    jvmToolchain(17)
}

// The oldest supported IDE (2023.1, since-build 231) bundles the Kotlin 1.8 standard library, and the plugin uses the
// IDE's copy (kotlin.stdlib.default.dependency=false). Newer library calls would fail at run time there.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        apiVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_8)
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

configurations.archives.canBeResolved = true

tasks {
  cyclonedxBom {
    setIncludeConfigs(List.of("runtimeClasspath"))
    inputs.files(configurations.named("runtimeClasspath").get(), configurations.archives)
    mustRunAfter(getTasksByName("buildPluginBlockmap", true))
  }
}

var bomFile = layout.buildDirectory.file("reports/bom.json")
artifacts.add("archives", bomFile.get().asFile) {
    name = "codescan-intellij"
    type = "json"
    classifier = "cyclonedx"
    builtBy("cyclonedxBom")
}

license {
    header = rootProject.file("HEADER")
    mapping(
      Map.of(
        "java", "SLASHSTAR_STYLE",
        "kt", "SLASHSTAR_STYLE",
        "svg", "XML_STYLE",
        "form", "XML_STYLE"
      )
    )
    excludes(List.of("**/*.jar", "**/*.png", "**/README"))
    strictCheck = true
}
